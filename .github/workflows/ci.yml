name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap locked dependencies
        run: ./script/bootstrap.sh
      - name: Run complete development and packaged-runtime checks
        run: ./script/check_all.sh
        env:
          MATH_ANCHOR_EXPECTED_ARCH: ${{ matrix.architecture }}
      - name: Build release-configuration app without distribution signing
        run: ./script/build_and_run.sh package
        env:
          MATH_ANCHOR_BUILD_CONFIGURATION: release
      - name: Verify release inputs and architecture
        run: ./script/check_release_hygiene.sh
        env:
          MATH_ANCHOR_EXPECTED_ARCH: ${{ matrix.architecture }}
          MATH_ANCHOR_VERIFY_APP_BUNDLE: "1"

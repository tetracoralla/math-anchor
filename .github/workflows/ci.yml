name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: headless Linux (${{ matrix.architecture }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-dev.lock
            requirements-runtime.lock
      - name: Run headless runtime and distribution checks
        run: ./script/check_headless.sh
      - name: Build the pinned OCI runtime
        run: docker build --tag "math-anchor-runtime:${{ matrix.architecture }}" .
      - name: Verify the OCI user, calculation, certificate, and checker
        run: |
          set -euo pipefail
          image="math-anchor-runtime:${{ matrix.architecture }}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "65532:65532"
          mkdir -p build/oci-smoke
          docker run --rm --entrypoint python "$image" -m math_anchor.cli run \
            certificate.polynomial_identity \
            '{"left":"(x+1)^2","right":"x^2+2*x+1","variables":["x"]}' \
            > build/oci-smoke/certificate.json
          docker run --rm -i --entrypoint python "$image" -m math_anchor.cli \
            verify-certificate - < build/oci-smoke/certificate.json \
            > build/oci-smoke/check.json
          python -c 'import json; value=json.load(open("build/oci-smoke/check.json")); assert value["valid"] is True'

  macos:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap locked dependencies
        run: ./script/bootstrap.sh
      - name: Run complete development and packaged-runtime checks
        run: ./script/check_all.sh
        env:
          MATH_ANCHOR_EXPECTED_ARCH: ${{ matrix.architecture }}
      - name: Build release-configuration app without distribution signing
        run: ./script/build_and_run.sh package
        env:
          MATH_ANCHOR_BUILD_CONFIGURATION: release
      - name: Verify release inputs and architecture
        run: ./script/check_release_hygiene.sh
        env:
          MATH_ANCHOR_EXPECTED_ARCH: ${{ matrix.architecture }}
          MATH_ANCHOR_VERIFY_APP_BUNDLE: "1"

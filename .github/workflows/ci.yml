name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap locked dependencies
        run: ./script/bootstrap.sh
      - name: Run complete development and packaged-runtime checks
        run: ./script/check_all.sh
        env:
          ZIBETHA_EXPECTED_ARCH: ${{ matrix.architecture }}
      - name: Build release-configuration app without distribution signing
        run: ./script/build_and_run.sh package
        env:
          ZIBETHA_BUILD_CONFIGURATION: release
      - name: Verify release inputs and architecture
        run: ./script/check_release_hygiene.sh
        env:
          ZIBETHA_EXPECTED_ARCH: ${{ matrix.architecture }}
          ZIBETHA_VERIFY_APP_BUNDLE: "1"

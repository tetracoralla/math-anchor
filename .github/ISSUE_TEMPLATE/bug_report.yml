name: Bug report
description: Report a reproducible Math Anchor defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not disclose vulnerabilities here. Use private vulnerability
        reporting from the repository Security tab.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - macOS calculator
        - CLI
        - MCP or Codex Plugin
        - Packaging or release tooling
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact input and shortest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS, architecture, Python/Swift version, and installation route when relevant.
    validations:
      required: true

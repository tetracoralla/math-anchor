[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-anchor"
version = "0.4.0"
description = "A safe scientific calculation runtime for humans and Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "openAdam" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "mcp>=1.13,<2",
  "jsonschema>=4,<5",
  "mpmath>=1.3,<2",
  "numpy>=2,<3",
  "pint>=0.24,<1",
  "psutil>=6,<8",
  "sympy>=1.13,<2",
]

[project.urls]
Homepage = "https://github.com/tetracoralla/math-anchor"
Repository = "https://github.com/tetracoralla/math-anchor"
Issues = "https://github.com/tetracoralla/math-anchor/issues"

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=5,<7", "pyinstaller>=6,<7"]

[project.scripts]
math-anchor = "math_anchor.cli:main"
math-anchor-mcp = "math_anchor.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
